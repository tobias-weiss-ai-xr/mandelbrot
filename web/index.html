<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandelbrot Set Variants — Rust/WASM</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #101014; color: #ddd;
         margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  header { padding: 0.8rem; text-align: center; }
  h1 { font-size: 1.1rem; margin: 0 0 0.6rem; font-weight: 500; }
  #controls { display: flex; gap: 1.2rem; align-items: center; justify-content: center;
              flex-wrap: wrap; font-size: 0.9rem; }
  canvas { max-width: min(96vw, 960px); border-radius: 6px; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #hint { color: #888; font-size: 0.8rem; }
</style>
</head>
<body>
<header>
  <h1>Mandelbrot Set Variants — Rust → WebAssembly</h1>
  <div id="controls">
    <label>Variant <select id="variant"></select></label>
    <label>Iterations <input type="range" id="iters" min="32" max="1024" step="32" value="256">
      <span id="itersVal">256</span></label>
    <span id="hint">scroll = zoom · drag = pan · <a href="terrain.html" style="color:#9f8cff">3D terrain</a> · <a href="bulb.html" style="color:#9f8cff">solid 3D</a></span>
    <span id="ms">–</span> ms
  </div>
</header>
<canvas id="c" width="960" height="640"></canvas>

<script type="module">
const W = 960, H = 640;
const VARIANTS = [
  { name: "Mandelbrot",   cx: -0.6,  cy:  0.0,  h: 2.7,  iters: 256 },
  { name: "Julia",        cx:  0.0,  cy:  0.0,  h: 3.0,  iters: 256 },
  { name: "Multibrot 3",  cx:  0.0,  cy:  0.0,  h: 3.4,  iters: 192 },
  { name: "Burning Ship", cx: -1.75, cy: -0.03, h: 0.15, iters: 256 },
  { name: "Tricorn",      cx: -0.6,  cy:  0.0,  h: 2.7,  iters: 256 },
];
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const select = document.getElementById("variant");
const iters = document.getElementById("iters");
const itersVal = document.getElementById("itersVal");
const ms = document.getElementById("ms");
VARIANTS.forEach((v, i) => select.add(new Option(v.name, i)));

const { instance } = await WebAssembly.instantiateStreaming(fetch("mandelbrot.wasm"));
const e = instance.exports;

let state = { ...VARIANTS[0] };

const SETTLE_MS = 150;
let settleTimer = 0;

function draw(scale) {
  const w = W / scale, h = H / scale;
  const t0 = performance.now();
  e.render(+select.value, state.cx, state.cy, state.h, +iters.value, scale);
  if (canvas.width !== w) { canvas.width = w; canvas.height = h; } // preview is CSS-upscaled
  const img = new ImageData(new Uint8ClampedArray(e.memory.buffer, e.buf_ptr(), w * h * 4), w, h);
  ctx.putImageData(img, 0, 0);
  if (scale === 1) ms.textContent = Math.round(performance.now() - t0);
}

// rAF-debounced; the lowest requested scale in a frame wins (full beats preview).
let pendingScale = 0, rafId = 0;
function requestDraw(scale) {
  if (!pendingScale || scale < pendingScale) pendingScale = scale;
  if (!rafId) {
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      const s = pendingScale;
      pendingScale = 0;
      draw(s);
    });
  }
}

// Continuous input: preview frames now, exactly one full render on settle.
function interact() {
  requestDraw(2);
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => requestDraw(1), SETTLE_MS);
}

select.onchange = () => {
  state = { ...VARIANTS[+select.value] };
  iters.value = state.iters;
  itersVal.textContent = state.iters;
  requestDraw(1);
};
iters.oninput = () => { itersVal.textContent = iters.value; requestDraw(1); };

// screen px → complex units (canvas is CSS-scaled)
function screenScale() {
  return (state.h / H) * (W / canvas.getBoundingClientRect().width);
}

canvas.onwheel = (ev) => {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  const px = (ev.clientX - r.left) * (W / r.width);
  const py = (ev.clientY - r.top) * (H / r.height);
  const s = state.h / H;
  const wx = state.cx + (px - W / 2) * s, wy = state.cy + (py - H / 2) * s;
  state.h *= Math.exp(ev.deltaY * 0.0015);
  const s2 = state.h / H;
  state.cx = wx - (px - W / 2) * s2;
  state.cy = wy - (py - H / 2) * s2;
  interact();
};

let drag = null;
canvas.onpointerdown = (ev) => { drag = { x: ev.clientX, y: ev.clientY }; canvas.setPointerCapture(ev.pointerId); };
canvas.onpointermove = (ev) => {
  if (!drag) return;
  const cpx = screenScale();
  state.cx -= (ev.clientX - drag.x) * cpx;
  state.cy -= (ev.clientY - drag.y) * cpx;
  drag = { x: ev.clientX, y: ev.clientY };
  interact();
};
canvas.onpointerup = canvas.onpointercancel = () => { drag = null; };

requestDraw(1);
</script>
</body>
</html>
